[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moogyberg-moearch_jd119"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出MoE 模型架构师·算子融合的收益边界上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "moogyberg" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://moogyberg.github.io"
Repository = "https://github.com/moogyberg/moearch_jd119"
Issues = "https://github.com/moogyberg/moearch_jd119/issues"

[project.scripts]
moearch_jd119 = "moearch_jd119:main"

[tool.setuptools]
py-modules = ["moearch_jd119"]
